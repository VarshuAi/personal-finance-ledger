<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Finance Ledger — Glassmorphism Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-row">
                <span class="logo-emoji">💰</span>
                <div class="title-col">
                    <h1>Quantum Finance Ledger</h1>
                    <p class="tagline">Track dynamic transactions, income, and expenses.</p>
                </div>
            </div>
            <div class="badge">productivity</div>
        </header>

        <main class="workspace-card">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px;">
                <input type="text" id="ledger-desc" placeholder="Salary, Rent...">
                <input type="number" id="ledger-amt" placeholder="Amount ($)">
            </div>
            <button class="btn" onclick="addTx()">Add Transaction</button>
            <ul id="tx-list" style="margin-top: 16px; padding: 0; list-style: none;"></ul>
        
        </main>
        
        <footer class="app-footer">
            <p>Created as a premium portfolio piece by <a href="https://github.com/VARSHAN69" target="_blank">@VARSHAN69</a></p>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
